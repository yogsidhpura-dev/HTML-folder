<!DOCTYPE html>
<html>
    <body>
        <h2>javaScript arrays</h2>
        <h2>jain() and pop()</h2>
        <p>The join () method joins arrays elements into a string and the popo() method remones the last element from an array</p>
        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop"></p>
        <script>
            var fruits = ["Banana", "Orange", "Apple", "mango"];
            document.getElementById("myjoin").innerHTML = fruits.join(" & ");
            document.getElementById("myfirstpop").innerHTML= fruits;
            fruits.pop();
            document.getElementById("mysecondpop").innerHTML = fruits
        </script>
    </body>
</html>
