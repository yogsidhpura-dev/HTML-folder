<!DOCTYPE html>
<html>
    <body>
        <h2>
            JavaScript Objects
        </h2>
        <p id="demo"></p>
        <script>
            var person = {
                firstName: "Shrey",
                age: 20,
            };
            document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old";
        </script>
    </body>
</html>
