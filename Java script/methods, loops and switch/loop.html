<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript for loop</h2>
        <p id="demo"></p>
        <script>
            var fruits = ["apple","mango", "grapes", "watermelon"];

            for (i=0; i<fruits.length; i++) {
                var text = fruits[i] + "<br>";
                document.write(text);
            }
            document.getElementById("demo").innerHTML=text
        </script>
    </body>
</html>
