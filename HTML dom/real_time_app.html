<!DOCTYPE html>
<html lang="en">
     <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=devise-width, initial-scale=1.0">
        <title>Login Form</title>
        <link rel="stylesheet" href="real_style.css">
     </head>
     <body>
        <h1>REAL TIME VALIDATION USING JS</h1>
        <hr>
        <form id="loginform" onsubmit="validate(event)">
            <fieldset>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="password">password:</label>
                    <input type="password" id="password" name="password">
                </div>
                <div>
                    <label for="age">age:</label>
                    <input type="number" id="age" name="age" min="12" max="50">
                </div>
                <button type="number">Login</button>
            </fieldset>
        </form>
        <div id="message"></div>
        <script src="real_script.js"></script>
     </body>
</html>
