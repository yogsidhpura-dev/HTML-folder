<!DOCTYPE html>
<html>
    <body>
        <h1>JavaScript arrow Function</h1>
        <p>This example shows an arrow Function with a parametre</p>
        <p id="result"></p>
        <script>
            opr = (a, b, c) => a+b-c;
            document.getElementById("result").innerHTML = opr (40, 6, 10);
        </script>
    </body>
</html>
