<!DOCTYPE html>
<html>

<body>
    <h2>The JavaScript Strinh() Method</h2>
    <p>The string() method can convert a number to a string.</p>
    <p id="number_result1"></p>
    <p id="string_result1"></p>

    <script>
        var x = 706;
        var y = 90;
        document.getElementById("number_result1").innerHTML= x+y;
        document.getElementById("string_result1").innerHTML= String(x) + String(y);
    </script>
</body>
</html>
