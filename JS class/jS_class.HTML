<!DOCTYPE html>
<html>
    <body>
        <h2>JavaScript Class</h2>
        <p>How to use JavaScript Class</p>
        <p id="stud1"></p>
        <p id="stud2"></p>
        <script>
            class student {
                constructor(name, year){
                    this.name = name;
                    this.year = year;
                }
                age() {
                    let date = new Date();
                    return date.getFullYear() - this.year;
                }
            }
            student1= new student ("riya", 2014);
            document.getElementById("stud1").innerHTML = "My name is"+ student1.
            name +"I born in" + student1.year + " and my age is" + student1.
            age();

            student2 = new student("Tina", 2018);
            document.getElementById("stud2").innerHTML = "My name is" + student2.
            name + " I bron in" + student2.year + "and my age is" + student2.
            age();
        </script>
    </body>
</html>
